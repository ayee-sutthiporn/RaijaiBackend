basePath: /api/v1
definitions:
  handlers.PaymentRequest:
    properties:
      amount:
        type: number
    type: object
  models.ActionType:
    enum:
    - CREATE
    - UPDATE
    - DELETE
    - PAYMENT
    type: string
    x-enum-varnames:
    - ActionCreate
    - ActionUpdate
    - ActionDelete
    - ActionPayment
  models.Category:
    properties:
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/models.CategoryType'
      user:
        $ref: '#/definitions/models.User'
      userId:
        type: string
    type: object
  models.CategoryType:
    enum:
    - INCOME
    - EXPENSE
    type: string
    x-enum-varnames:
    - CategoryTypeIncome
    - CategoryTypeExpense
  models.DateOnly:
    properties:
      time.Time:
        type: string
    type: object
  models.Debt:
    properties:
      autoDeduct:
        type: boolean
      createdAt:
        type: string
      dueDate:
        $ref: '#/definitions/models.DateOnly'
      id:
        type: string
      installmentPlan:
        $ref: '#/definitions/models.InstallmentPlan'
      isInstallment:
        type: boolean
      personName:
        type: string
      remainingAmount:
        type: number
      remark:
        type: string
      title:
        type: string
      totalAmount:
        type: number
      type:
        $ref: '#/definitions/models.DebtType'
      user:
        $ref: '#/definitions/models.User'
      userId:
        type: string
      wallet:
        $ref: '#/definitions/models.Wallet'
      walletId:
        type: string
    type: object
  models.DebtType:
    enum:
    - LENT
    - BORROWED
    type: string
    x-enum-varnames:
    - DebtTypeLent
    - DebtTypeBorrowed
  models.HistoryLog:
    properties:
      action:
        $ref: '#/definitions/models.ActionType'
      changes:
        type: string
      details:
        type: string
      entityId:
        type: string
      entityType:
        type: string
      id:
        type: string
      newValue:
        type: string
      previousValue:
        type: string
      timestamp:
        type: string
      user:
        $ref: '#/definitions/models.User'
      userId:
        type: string
    type: object
  models.InstallmentPlan:
    properties:
      interestRate:
        type: number
      monthlyAmount:
        type: number
      paidMonths:
        type: integer
      startDate:
        $ref: '#/definitions/models.DateOnly'
      totalMonths:
        type: integer
    type: object
  models.Transaction:
    properties:
      amount:
        type: number
      category:
        $ref: '#/definitions/models.Category'
      categoryId:
        type: string
      createdAt:
        type: string
      createdBy:
        $ref: '#/definitions/models.User'
      createdById:
        type: string
      date:
        $ref: '#/definitions/models.DateOnly'
      description:
        type: string
      id:
        type: string
      toWallet:
        $ref: '#/definitions/models.Wallet'
      toWalletId:
        type: string
      type:
        $ref: '#/definitions/models.TransactionType'
      wallet:
        $ref: '#/definitions/models.Wallet'
      walletId:
        type: string
    type: object
  models.TransactionType:
    enum:
    - INCOME
    - EXPENSE
    - TRANSFER
    type: string
    x-enum-varnames:
    - TransactionTypeIncome
    - TransactionTypeExpense
    - TransactionTypeTransfer
  models.User:
    properties:
      avatarUrl:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Wallet:
    properties:
      balance:
        type: number
      color:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      id:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/models.User'
      ownerId:
        type: string
      type:
        $ref: '#/definitions/models.WalletType'
    type: object
  models.WalletType:
    enum:
    - CASH
    - BANK
    - CREDIT_CARD
    type: string
    x-enum-varnames:
    - WalletTypeCash
    - WalletTypeBank
    - WalletTypeCreditCard
host: raijai-api.sutthiporn.dev
info:
  contact: {}
  description: RESTful API for RaiJai Application
  title: RaiJai API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with username and password
      parameters:
      - description: Username and Password
        in: body
        name: credentials
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login to the system
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Get a new access token using a refresh token
      parameters:
      - description: Refresh Token
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: New Token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: User Details
        in: body
        name: user
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Success Message
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /categories:
    get:
      description: Get all categories (optional filter by type)
      parameters:
      - description: Category Type (INCOME/EXPENSE)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
      summary: Get all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category
      parameters:
      - description: Category Data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.Category'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Category'
      summary: Create a new category
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Delete a category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a category
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update a category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category Data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.Category'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Category'
      summary: Update a category
      tags:
      - categories
  /debts:
    get:
      description: Get all debts (optional filter by type)
      parameters:
      - description: Debt Type (LENT/BORROWED)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Debt'
            type: array
      summary: Get all debts
      tags:
      - debts
    post:
      consumes:
      - application/json
      description: Create a new debt (Lent or Borrowed)
      parameters:
      - description: Debt Data
        in: body
        name: debt
        required: true
        schema:
          $ref: '#/definitions/models.Debt'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Debt'
      summary: Create a new debt record
      tags:
      - debts
  /debts/{id}:
    delete:
      description: Delete a debt by ID
      parameters:
      - description: Debt ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a debt
      tags:
      - debts
    get:
      description: Get a debt by ID
      parameters:
      - description: Debt ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Debt'
      summary: Get a debt by ID
      tags:
      - debts
    put:
      consumes:
      - application/json
      description: Update a debt by ID
      parameters:
      - description: Debt ID
        in: path
        name: id
        required: true
        type: string
      - description: Debt Data
        in: body
        name: debt
        required: true
        schema:
          $ref: '#/definitions/models.Debt'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Debt'
      summary: Update a debt
      tags:
      - debts
  /debts/{id}/payment:
    post:
      consumes:
      - application/json
      description: Deduct amount from debt
      parameters:
      - description: Debt ID
        in: path
        name: id
        required: true
        type: string
      - description: Payment Amount
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/handlers.PaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Debt'
      summary: Make a payment for a debt
      tags:
      - debts
  /history:
    get:
      description: Get history logs, optionally filtered by entity
      parameters:
      - description: Filter by Entity ID
        in: query
        name: entity_id
        type: string
      - description: Filter by Entity Type
        in: query
        name: entity_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.HistoryLog'
            type: array
      summary: Get history logs
      tags:
      - history
  /reports/balance-history:
    get:
      description: Get history of total balance over time
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Get balance history
      tags:
      - reports
  /reports/category-pie:
    get:
      description: Get pie chart data for categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Get category distribution
      tags:
      - reports
  /reports/summary:
    get:
      description: Get summary of income and expenses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get income/expense summary
      tags:
      - reports
  /transactions:
    get:
      description: Get all transactions with optional filters
      parameters:
      - description: Filter by Wallet ID
        in: query
        name: wallet_id
        type: string
      - description: Filter by Category ID
        in: query
        name: category_id
        type: string
      - description: Start Date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End Date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Search Description
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Transaction'
            type: array
      summary: Get all transactions
      tags:
      - transactions
    post:
      consumes:
      - application/json
      description: Create a new transaction (Income, Expense, Transfer)
      parameters:
      - description: Transaction Data
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/models.Transaction'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Transaction'
      summary: Create a new transaction
      tags:
      - transactions
  /transactions/{id}:
    delete:
      description: Delete a transaction by ID
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a transaction
      tags:
      - transactions
    get:
      description: Get a transaction by ID
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Transaction'
      summary: Get a transaction by ID
      tags:
      - transactions
    put:
      consumes:
      - application/json
      description: Update a transaction by ID
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      - description: Transaction Data
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/models.Transaction'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Transaction'
      summary: Update a transaction
      tags:
      - transactions
  /upload/image:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image file (returns a mock URL)
      parameters:
      - description: Image File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Image URL
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload an image
      tags:
      - system
  /users:
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: User Data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
      summary: Create a new user
      tags:
      - users
  /users/{id}:
    get:
      description: Get user details
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      summary: Get a user by ID
      tags:
      - users
  /users/me:
    get:
      description: Get profile of the logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      summary: Get current user profile
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update profile details of the logged-in user
      parameters:
      - description: User Details
        in: body
        name: user
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      summary: Update current user profile
      tags:
      - users
  /users/me/change-password:
    post:
      consumes:
      - application/json
      description: Change the password of the logged-in user
      parameters:
      - description: Old and New Password
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change password
      tags:
      - users
  /wallets:
    get:
      description: Get all wallets specific to a user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Wallet'
            type: array
      summary: Get all wallets by User ID
      tags:
      - wallets
    post:
      consumes:
      - application/json
      - application/json
      description: |-
        Create a new wallet
        Create a new wallet
      parameters:
      - description: Wallet Data
        in: body
        name: wallet
        required: true
        schema:
          $ref: '#/definitions/models.Wallet'
      - description: Wallet Data
        in: body
        name: wallet
        required: true
        schema:
          $ref: '#/definitions/models.Wallet'
      produces:
      - application/json
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Wallet'
      summary: Create a new wallet
      tags:
      - wallets
      - wallets
  /wallets/{id}:
    delete:
      description: Delete a wallet by ID
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a wallet
      tags:
      - wallets
    get:
      description: Get a wallet by ID
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Wallet'
      summary: Get a wallet by ID
      tags:
      - wallets
    put:
      consumes:
      - application/json
      description: Update a wallet by ID
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
        type: string
      - description: Wallet Data
        in: body
        name: wallet
        required: true
        schema:
          $ref: '#/definitions/models.Wallet'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Wallet'
      summary: Update a wallet
      tags:
      - wallets
schemes:
- https
swagger: "2.0"
